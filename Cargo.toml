[workspace]
resolver = "2"

members = [
    "certval",
    "pkiprocmacros",
    "pittv3",
]

[profile.bench]
debug = true

[profile.release]
debug = true

[patch.crates-io]
der_derive = { git = "https://github.com/RustCrypto/formats.git" }
cms = { git = "https://github.com/RustCrypto/formats.git" }
x509-cert = { git = "https://github.com/RustCrypto/formats.git" }
x509-ocsp = { git = "https://github.com/RustCrypto/formats.git" }

ml-dsa          = { git = "https://github.com/RustCrypto/signatures.git" }
slh-dsa         = { git = "https://github.com/RustCrypto/signatures.git"}
